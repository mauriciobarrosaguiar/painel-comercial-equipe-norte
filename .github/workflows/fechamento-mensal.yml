name: Fechamento mensal do painel

on:
  workflow_dispatch:
    inputs:
      ano_mes:
        description: "Mês no formato AAAA-MM. Vazio usa o mês anterior."
        required: false
        default: ""
      reprocessar:
        description: "Criar nova versão"
        required: false
        type: boolean
        default: false
      motivo:
        description: "Motivo do reprocessamento"
        required: false
        default: ""
  schedule:
    - cron: "20 5 1 * *"

permissions:
  contents: read

concurrency:
  group: fechamento-mensal
  cancel-in-progress: false

jobs:
  fechar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gravar fotografia mensal
        env:
          PAINEL_ADMIN_KEY: ${{ secrets.PAINEL_ADMIN_KEY }}
          ANO_MES: ${{ inputs.ano_mes }}
          REPROCESSAR: ${{ inputs.reprocessar }}
          MOTIVO: ${{ inputs.motivo }}
        shell: bash
        run: |
          node <<'NODE' > payload.json
          const p={}
          if(process.env.ANO_MES)p.ano_mes=process.env.ANO_MES
          if(process.env.REPROCESSAR==='true')p.reprocessar=true
          if(process.env.MOTIVO)p.motivo=process.env.MOTIVO
          process.stdout.write(JSON.stringify(p))
          NODE
          curl --fail-with-body --silent --show-error \
            --request POST "https://painel-equipe-norte.pages.dev/api/internal/fechamento-mensal" \
            --header "x-admin-key: ${PAINEL_ADMIN_KEY}" \
            --header "content-type: application/json" \
            --data @payload.json | tee fechamento.json

      - name: Congelar resultado do Desafio de Gigantes
        env:
          PAINEL_ADMIN_KEY: ${{ secrets.PAINEL_ADMIN_KEY }}
          ANO_MES: ${{ inputs.ano_mes }}
        shell: bash
        run: |
          node <<'NODE' > desafio-fechamento.json
          const p={}
          if(process.env.ANO_MES)p.ano_mes=process.env.ANO_MES
          process.stdout.write(JSON.stringify(p))
          NODE
          curl --fail-with-body --silent --show-error \
            --request POST "https://painel-equipe-norte.pages.dev/api/internal/desafio-gigantes-fechamento" \
            --header "x-admin-key: ${PAINEL_ADMIN_KEY}" \
            --header "content-type: application/json" \
            --data @desafio-fechamento.json | tee desafio-fechamento-resposta.json
