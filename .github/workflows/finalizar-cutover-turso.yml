name: Finalizar cutover Turso validado

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalizar-cutover-turso.yml"

permissions:
  contents: write

concurrency:
  group: finalizar-cutover-turso
  cancel-in-progress: false

jobs:
  validar-e-ativar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE: painel-equipe-norte-db
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar cliente HTTP
        run: python -m pip install --disable-pip-version-check "requests>=2.34,<3"

      - name: Comparar tabelas essenciais D1 x Turso
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from scripts import migrar_d1_turso as mig
          from scripts import turso_backend as turso

          db = turso.database_id()
          tabelas = [
              "clientes",
              "colaboradores_acesso",
              "consultores",
              "produtos",
              "produtos_mix_sap",
              "pedidos",
              "itens_pedido",
              "metas",
              "sips",
              "sip_clientes",
              "mercado_farma_precos",
              "mercado_farma_precos_historico",
              "historico_mensal",
              "configuracoes_automacao",
              "comandos_automacao",
              "integracao_credenciais",
          ]

          divergencias = []
          for tabela in tabelas:
              d1 = mig.d1_query(f'SELECT COUNT(*) AS total FROM "{tabela}"')
              d1_total = int((d1[0] or {}).get("total") or 0)
              tr = turso.linhas(turso.executar(db, f'SELECT COUNT(*) AS total FROM "{tabela}"'))
              tr_total = int((tr[0] or {}).get("total") or 0)
              print(f"{tabela}: D1={d1_total} Turso={tr_total}")
              if d1_total != tr_total:
                  divergencias.append((tabela, d1_total, tr_total))

          if divergencias:
              raise SystemExit(f"DIVERGENCIAS: {divergencias}")

          # Confirma escrita no novo banco e remove o registro logo em seguida.
          turso.executar(db, "CREATE TABLE IF NOT EXISTS __cutover_validation (id TEXT PRIMARY KEY, criado_em TEXT)")
          turso.executar(db, "INSERT OR REPLACE INTO __cutover_validation(id,criado_em) VALUES(?,CURRENT_TIMESTAMP)", ["final"])
          teste = turso.linhas(turso.executar(db, "SELECT COUNT(*) AS total FROM __cutover_validation WHERE id='final'"))
          if int((teste[0] or {}).get("total") or 0) != 1:
              raise SystemExit("ESCRITA_TURSO_NAO_CONFIRMADA")
          turso.executar(db, "DELETE FROM __cutover_validation WHERE id='final'")
          print("CUTOVER_DATA_VALIDATED")
          PY

      - name: Ativar Turso como banco principal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p config
          printf 'turso\n' > config/turso-cutover-active.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/turso-cutover-active.txt
          if git diff --cached --quiet; then
            echo "Marcador já estava ativo."
          else
            git commit -m "cutover: ativar novo Turso como banco principal"
            git pull --rebase origin main
            git push origin main
          fi
