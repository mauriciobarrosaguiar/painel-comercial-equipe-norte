name: Finalizar cutover Turso validado

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalizar-cutover-turso.yml"

permissions:
  contents: write

concurrency:
  group: finalizar-cutover-turso
  cancel-in-progress: false

jobs:
  validar-e-ativar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar cliente HTTP
        run: python -m pip install --disable-pip-version-check "requests>=2.34,<3"

      - name: Validar snapshot migrado no Turso
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from scripts import turso_backend as turso

          db = turso.database_id()

          # Contagens confirmadas pelo snapshot completo que terminou com
          # MIGRACAO_TURSO_OK antes de o D1 atingir o limite diário de leitura.
          esperados = {
              "clientes": 546,
              "colaboradores_acesso": 6,
              "consultores": 7,
              "produtos": 451,
              "produtos_mix_sap": 191,
              "pedidos": 8054,
              "itens_pedido": 76833,
              "metas": 4,
              "sips": 9,
              "sip_clientes": 71,
              "mercado_farma_precos": 5923,
              "mercado_farma_precos_historico": 70419,
              "historico_mensal": 84,
              "configuracoes_automacao": 3,
              "comandos_automacao": 878,
              "integracao_credenciais": 2,
          }

          divergencias = []
          for tabela, esperado in esperados.items():
              tr = turso.linhas(turso.executar(db, f'SELECT COUNT(*) AS total FROM "{tabela}"'))
              atual = int((tr[0] or {}).get("total") or 0)
              print(f"{tabela}: esperado={esperado} Turso={atual}")
              if atual != esperado:
                  divergencias.append((tabela, esperado, atual))

          if divergencias:
              raise SystemExit(f"DIVERGENCIAS_NO_TURSO: {divergencias}")

          # Confirma escrita no novo banco e remove o registro logo em seguida.
          turso.executar(db, "CREATE TABLE IF NOT EXISTS __cutover_validation (id TEXT PRIMARY KEY, criado_em TEXT)")
          turso.executar(db, "INSERT OR REPLACE INTO __cutover_validation(id,criado_em) VALUES(?,CURRENT_TIMESTAMP)", ["final"])
          teste = turso.linhas(turso.executar(db, "SELECT COUNT(*) AS total FROM __cutover_validation WHERE id='final'"))
          if int((teste[0] or {}).get("total") or 0) != 1:
              raise SystemExit("ESCRITA_TURSO_NAO_CONFIRMADA")
          turso.executar(db, "DELETE FROM __cutover_validation WHERE id='final'")
          print("CUTOVER_DATA_VALIDATED")
          PY

      - name: Ativar Turso como banco principal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p config
          printf 'turso\n' > config/turso-cutover-active.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/turso-cutover-active.txt
          if git diff --cached --quiet; then
            echo "Marcador já estava ativo."
          else
            git commit -m "cutover: ativar novo Turso como banco principal"
            git pull --rebase origin main
            git push origin main
          fi
