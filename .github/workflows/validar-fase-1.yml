name: Validar Fase 1

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Testar regras, migrações e legado
        run: python -m pytest -q
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Atualizar lock seguro e instalar dependências web
        working-directory: web
        run: |
          npm update wrangler --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
      - name: Publicar lock corrigido
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-corrigido-${{ github.run_id }}
          path: web/package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Verificar dependências conhecidas
        id: audit_web
        working-directory: web
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json 2>&1 | tee audit-output.json
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publicar relatório da auditoria npm
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-auditoria-npm-${{ github.run_id }}
          path: web/audit-output.json
          if-no-files-found: error
          retention-days: 7
      - name: Testar APIs e cálculos web
        id: testes_web
        working-directory: web
        shell: bash
        run: |
          set +e
          npm run test:web 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publicar relatório dos testes web
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-web-${{ github.run_id }}
          path: web/test-output.txt
          if-no-files-found: error
          retention-days: 7
      - name: Interromper quando os testes web falharem
        if: steps.testes_web.outputs.status != '0'
        run: exit 1
      - name: Compilar aplicação de produção
        id: build_web
        working-directory: web
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publicar relatório da compilação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-build-web-${{ github.run_id }}
          path: web/build-output.txt
          if-no-files-found: error
          retention-days: 7
      - name: Interromper quando a compilação falhar
        if: steps.build_web.outputs.status != '0'
        run: exit 1
      - name: Interromper quando a auditoria npm encontrar risco alto
        if: steps.audit_web.outputs.status != '0'
        run: exit 1
