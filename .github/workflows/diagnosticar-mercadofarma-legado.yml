name: Diagnosticar acesso Mercado Farma legado

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnosticar-mercadofarma-legado.yml"
      - "src/mercadofarma_inventory.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}
      PERSISTENCE_KEY: ${{ secrets.PERSISTENCE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPO: ${{ github.repository }}
      GITHUB_BRANCH: main
      GITHUB_STORAGE_BRANCH: app-storage
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE: painel-equipe-norte-db

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verificar acesso legado sem expor segredo
        run: |
          python - <<'PY'
          from src.configuracoes import carregar_login_bussola
          from src.mercado_farma import carregar_credenciais_mercadofarma
          login = carregar_login_bussola()
          cred = carregar_credenciais_mercadofarma(login, exigir=False)
          print({
              "configurado": bool(cred.get("configurado")),
              "usuario_mascarado": cred.get("usuario_mascarado") or "",
              "fonte": cred.get("fonte") or "",
              "faltantes": cred.get("faltantes") or [],
          })
          if not cred.get("configurado"):
              raise SystemExit("ACESSO_MERCADO_FARMA_LEGADO_AUSENTE")
          print("ACESSO_MERCADO_FARMA_LEGADO_OK")
          PY

      - name: Testar 1 EAN no Mercado Farma usando Turso
        run: python automacoes/mercadofarma_turso_atualizado.py --uf TO --limite-eans 1

      - name: Confirmar teste
        shell: bash
        run: |
          set -euo pipefail
          test -f data/mercadofarma/status/mercadofarma_TO.json
          grep -q '"status": "sucesso"' data/mercadofarma/status/mercadofarma_TO.json
          echo "MERCADO_FARMA_TURSO_LEGADO_OK"
