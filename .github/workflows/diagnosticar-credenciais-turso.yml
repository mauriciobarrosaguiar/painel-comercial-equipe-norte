name: Diagnosticar credenciais Turso

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnosticar-credenciais-turso.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "requests>=2.34,<3"
      - name: Listar apenas metadados das credenciais
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from scripts import turso_backend as turso
          db=turso.database_id()
          rows=turso.linhas(turso.executar(db, """
            SELECT integracao, usuario_mascarado, status, mensagem_status, testado_em, atualizado_em,
                   CASE WHEN TRIM(COALESCE(credencial_cifrada,''))<>'' THEN 1 ELSE 0 END AS tem_credencial
              FROM integracao_credenciais
             ORDER BY integracao
          """))
          for r in rows:
              print(r)
          PY
