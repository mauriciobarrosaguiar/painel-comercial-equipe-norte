name: Verificar SAPs após integração do Desafio

on:
  push:
    branches:
      - main
    paths:
      - web/functions/api/admin/bases.js
      - web/functions/api/desafio-gigantes.js
      - web/functions/api/desafio-gigantes-disparar.js
      - web/src/DesafioGigantesCard.tsx
      - scripts/identificar_desafio_gigantes_sap.py
      - .github/workflows/desafio-gigantes-sap.yml
      - .github/workflows/desafio-gigantes-sap-import.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mercado-farma-atualizacao
  cancel-in-progress: false

jobs:
  identificar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPO: ${{ github.repository }}
      GITHUB_BRANCH: main
      GITHUB_STORAGE_BRANCH: app-storage
      PERSISTENCE_KEY: ${{ secrets.PERSISTENCE_KEY }}
      MERCADOFARMA_USUARIO: ${{ secrets.MERCADOFARMA_USUARIO }}
      MERCADOFARMA_SENHA: ${{ secrets.MERCADOFARMA_SENHA }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE: painel-equipe-norte-db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Identificar SAPs pendentes
        run: python scripts/identificar_desafio_gigantes_sap.py
