name: Deploy Painel no Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "config/turso-cutover-active.txt"
      - ".github/workflows/deploy-cloudflare-pages.yml"

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-painel-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Compilar painel
        run: npm run build

      - name: Confirmar banco D1 pessoal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler@4.112.0 d1 list --json > d1-list.json

          if ! node <<'NODE'
          const fs = require('fs')
          const data = JSON.parse(fs.readFileSync('d1-list.json', 'utf8'))
          const databases = Array.isArray(data) ? data : (Array.isArray(data.result) ? data.result : [])
          process.exit(databases.some((item) => item && item.name === 'painel-equipe-norte-db') ? 0 : 1)
          NODE
          then
            npx wrangler@4.112.0 d1 create painel-equipe-norte-db
            npx wrangler@4.112.0 d1 list --json > d1-list.json
          fi

          node <<'NODE'
          const fs = require('fs')
          const data = JSON.parse(fs.readFileSync('d1-list.json', 'utf8'))
          const databases = Array.isArray(data) ? data : (Array.isArray(data.result) ? data.result : [])
          const database = databases.find((item) => item && item.name === 'painel-equipe-norte-db')
          const databaseId = database?.uuid || database?.database_id || database?.id

          if (!databaseId) {
            throw new Error('Não foi possível localizar o ID do banco D1 de backup.')
          }

          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'))
          config.d1_databases[0].database_id = databaseId
          fs.writeFileSync('wrangler.jsonc', `${JSON.stringify(config, null, 2)}\n`)
          console.log('D1 confirmado como binding principal do painel pessoal.')
          NODE

      - name: Identificar backend principal
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "../config/turso-cutover-active.txt" ]; then
            echo "PAINEL_BACKEND_ALVO=turso" >> "$GITHUB_ENV"
            echo "Cutover Turso ativo."
          else
            echo "PAINEL_BACKEND_ALVO=d1" >> "$GITHUB_ENV"
            echo "Cutover Turso ainda não ativado; D1 permanece temporariamente."
          fi

      - name: Definir main como branch de produção
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/painel-equipe-norte" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"production_branch":"main"}' \
            --output pages-project.json

          node <<'NODE'
          const fs = require('fs')
          const response = JSON.parse(fs.readFileSync('pages-project.json', 'utf8'))
          if (!response.success) {
            throw new Error(`Cloudflare recusou a alteração da produção: ${JSON.stringify(response.errors || response)}`)
          }
          if (response.result?.production_branch !== 'main') {
            throw new Error(`Branch de produção inesperada: ${response.result?.production_branch || 'não informada'}`)
          }
          console.log('Branch main confirmada como produção do Pages.')
          NODE

      - name: Configurar chave administrativa do Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAINEL_ADMIN_KEY: ${{ secrets.PAINEL_ADMIN_KEY }}
        shell: bash
        run: |
          if [ -z "${PAINEL_ADMIN_KEY:-}" ]; then
            echo "::warning::PAINEL_ADMIN_KEY ainda não foi adicionado aos Secrets do GitHub."
          else
            printf '%s' "$PAINEL_ADMIN_KEY" | npx wrangler@4.112.0 pages secret put PAINEL_ADMIN_KEY --project-name painel-equipe-norte
            echo "Chave administrativa configurada no Cloudflare Pages."
          fi

      - name: Configurar backend principal do painel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${PAINEL_BACKEND_ALVO}" = "turso" ]; then
            test -n "${TURSO_DATABASE_URL:-}"
            test -n "${TURSO_AUTH_TOKEN:-}"
            printf '%s' "$TURSO_DATABASE_URL" | npx wrangler@4.112.0 pages secret put TURSO_DATABASE_URL --project-name painel-equipe-norte
            printf '%s' "$TURSO_AUTH_TOKEN" | npx wrangler@4.112.0 pages secret put TURSO_AUTH_TOKEN --project-name painel-equipe-norte
            printf '%s' 'turso' | npx wrangler@4.112.0 pages secret put PAINEL_DB_BACKEND --project-name painel-equipe-norte
            echo "Backend principal configurado como Turso."
          else
            printf '%s' 'd1' | npx wrangler@4.112.0 pages secret put PAINEL_DB_BACKEND --project-name painel-equipe-norte
            echo "Backend principal mantido no D1."
          fi

      - name: Configurar disparo imediato do GitHub Actions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAINEL_GITHUB_ACTIONS_TOKEN: ${{ secrets.PAINEL_GITHUB_ACTIONS_TOKEN || secrets.GITHUB_PAT || secrets.GH_PAT || secrets.PAT_TOKEN }}
        shell: bash
        run: |
          if [ -z "${PAINEL_GITHUB_ACTIONS_TOKEN:-}" ]; then
            echo "::warning::Adicione o secret PAINEL_GITHUB_ACTIONS_TOKEN com permissão Actions: write para ativar o disparo imediato. A fila de contingência continuará funcionando."
          else
            printf '%s' "$PAINEL_GITHUB_ACTIONS_TOKEN" | npx wrangler@4.112.0 pages secret put GITHUB_ACTIONS_TOKEN --project-name painel-equipe-norte
            echo "Token de disparo imediato configurado no Cloudflare Pages."
          fi

      - name: Confirmar configuração de banco
        shell: bash
        run: |
          echo "Backend alvo desta publicação: ${PAINEL_BACKEND_ALVO}"

      - name: Publicar versão no ambiente de produção
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.112.0 pages deploy dist --project-name painel-equipe-norte --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true --skip-caching
