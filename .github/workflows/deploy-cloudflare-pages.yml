name: Deploy Painel no Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-painel-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: web

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci --ignore-scripts --no-audit

      - name: Compilar painel
        run: npm run build

      - name: Localizar ou criar banco D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler d1 list --json > d1-list.json

          if ! node <<'NODE'
          const fs = require('fs')
          const data = JSON.parse(fs.readFileSync('d1-list.json', 'utf8'))
          const databases = Array.isArray(data) ? data : (Array.isArray(data.result) ? data.result : [])
          process.exit(databases.some((item) => item && item.name === 'painel-equipe-norte-db') ? 0 : 1)
          NODE
          then
            npx wrangler d1 create painel-equipe-norte-db
            npx wrangler d1 list --json > d1-list.json
          fi

          node <<'NODE'
          const fs = require('fs')
          const data = JSON.parse(fs.readFileSync('d1-list.json', 'utf8'))
          const databases = Array.isArray(data) ? data : (Array.isArray(data.result) ? data.result : [])
          const database = databases.find((item) => item && item.name === 'painel-equipe-norte-db')
          const databaseId = database?.uuid || database?.database_id || database?.id

          if (!databaseId) {
            throw new Error('Não foi possível localizar o ID do banco D1.')
          }

          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'))
          config.d1_databases[0].database_id = databaseId
          fs.writeFileSync('wrangler.jsonc', `${JSON.stringify(config, null, 2)}\n`)
          console.log('Banco D1 localizado e configuração preparada.')
          NODE

      - name: Aplicar estrutura inicial do banco
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Definir main como branch de produção
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/painel-equipe-norte" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"production_branch":"main"}' \
            --output pages-project.json

          node <<'NODE'
          const fs = require('fs')
          const response = JSON.parse(fs.readFileSync('pages-project.json', 'utf8'))
          if (!response.success) {
            throw new Error(`Cloudflare recusou a alteração da produção: ${JSON.stringify(response.errors || response)}`)
          }
          if (response.result?.production_branch !== 'main') {
            throw new Error(`Branch de produção inesperada: ${response.result?.production_branch || 'não informada'}`)
          }
          console.log('Branch main confirmada como produção do Pages.')
          NODE

      - name: Configurar chave administrativa do Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAINEL_ADMIN_KEY: ${{ secrets.PAINEL_ADMIN_KEY }}
        shell: bash
        run: |
          if [ -z "${PAINEL_ADMIN_KEY:-}" ]; then
            echo "::warning::PAINEL_ADMIN_KEY ainda não foi adicionado aos Secrets do GitHub."
          else
            printf '%s' "$PAINEL_ADMIN_KEY" | npx wrangler pages secret put PAINEL_ADMIN_KEY --project-name painel-equipe-norte
            echo "Chave administrativa configurada no Cloudflare Pages."
          fi

      - name: Configurar disparo imediato do GitHub Actions no Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAINEL_GITHUB_ACTIONS_TOKEN: ${{ secrets.PAINEL_GITHUB_ACTIONS_TOKEN || secrets.GITHUB_PAT || secrets.GH_PAT || secrets.PAT_TOKEN }}
        shell: bash
        run: |
          if [ -z "${PAINEL_GITHUB_ACTIONS_TOKEN:-}" ]; then
            echo "::warning::Adicione o secret PAINEL_GITHUB_ACTIONS_TOKEN com permissão Actions: write para ativar o disparo imediato."
          else
            printf '%s' "$PAINEL_GITHUB_ACTIONS_TOKEN" | npx wrangler pages secret put GITHUB_ACTIONS_TOKEN --project-name painel-equipe-norte
            echo "Token de disparo imediato configurado no Cloudflare Pages."
          fi

      - name: Publicar versão no ambiente de produção
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name painel-equipe-norte --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true --skip-caching

      - name: Publicar processador de automações no Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config automation-worker/wrangler.jsonc

      - name: Configurar segredos do processador Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAINEL_ADMIN_KEY: ${{ secrets.PAINEL_ADMIN_KEY }}
          PAINEL_GITHUB_ACTIONS_TOKEN: ${{ secrets.PAINEL_GITHUB_ACTIONS_TOKEN || secrets.GITHUB_PAT || secrets.GH_PAT || secrets.PAT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PAINEL_ADMIN_KEY:-}" ]; then
            echo "::error::PAINEL_ADMIN_KEY é obrigatório para o processador Cloudflare."
            exit 1
          fi
          if [ -z "${PAINEL_GITHUB_ACTIONS_TOKEN:-}" ]; then
            echo "::error::PAINEL_GITHUB_ACTIONS_TOKEN com permissão Actions: write é obrigatório para disparar as extrações."
            exit 1
          fi
          printf '%s' "$PAINEL_ADMIN_KEY" | npx wrangler secret put PAINEL_ADMIN_KEY --config automation-worker/wrangler.jsonc
          printf '%s' "$PAINEL_GITHUB_ACTIONS_TOKEN" | npx wrangler secret put GITHUB_ACTIONS_TOKEN --config automation-worker/wrangler.jsonc
          echo "Processador Cloudflare configurado para verificar a fila a cada 5 minutos."
