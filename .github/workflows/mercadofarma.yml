name: Mercado Farma por UF
run-name: Mercado Farma / ${{ inputs.command_id || 'automático' }} / ${{ inputs.acao || 'atualizar_mercadofarma_paralelo' }} / ${{ inputs.ufs || inputs.uf || 'todas' }}

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "Acao solicitada pelo painel"
        required: true
        default: "atualizar_mercadofarma_paralelo"
      ufs:
        description: "UFs separadas por virgula. Vazio detecta automaticamente todas as UFs da carteira do Maurício."
        required: false
        default: ""
      uf:
        description: "Compatibilidade: UF ou UFs separadas por virgula."
        required: false
        default: ""
      limite_eans:
        description: "Limite de EANs para teste. 0 executa todos."
        required: false
        default: "0"
      command_id:
        description: "Identificador do disparo pelo painel"
        required: false
        default: ""
      headless:
        description: "Rodar navegador oculto"
        required: false
        default: "true"
      mercadofarma_usuario:
        description: "Compatibilidade legada; o painel usa a credencial pessoal cadastrada"
        required: false
        default: ""
      mercadofarma_senha:
        description: "Compatibilidade legada; o painel usa a credencial pessoal cadastrada"
        required: false
        default: ""
      persistence_key:
        description: "Chave de persistencia enviada pelo painel"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: mercado-farma-atualizacao
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  preparar_ufs:
    if: ${{ inputs.acao == 'atualizar_mercadofarma_paralelo' }}
    runs-on: ubuntu-latest
    outputs:
      ufs_json: ${{ steps.detectar.outputs.ufs_json }}
      ufs_texto: ${{ steps.detectar.outputs.ufs_texto }}
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      UFS_SOLICITADAS: ${{ inputs.ufs || inputs.uf || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar janela do Mercado Farma (07h-20h, Brasília)
        run: python scripts/janela_mercadofarma.py --check

      - name: Instalar cliente Turso
        run: python -m pip install --disable-pip-version-check "requests>=2.34,<3"

      - name: Detectar UFs da carteira do Maurício
        id: detectar
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts import turso_backend as turso

          db = turso.database_id()
          dados = turso.linhas(turso.executar(db, """
              SELECT DISTINCT UPPER(TRIM(COALESCE(uf,''))) AS uf
                FROM clientes
               WHERE carteira_importada=1
                 AND ativo=1
                 AND consultor_id='cons-1ee6626b98906f06c399a6ad350c'
                 AND LENGTH(TRIM(COALESCE(cnpj,'')))=14
                 AND LENGTH(TRIM(COALESCE(uf,'')))=2
               ORDER BY uf
          """))
          disponiveis = [
              str(item.get("uf") or "").strip().upper()
              for item in dados
              if str(item.get("uf") or "").strip()
          ]

          solicitado_raw = os.environ.get("UFS_SOLICITADAS", "")
          solicitadas = []
          for parte in solicitado_raw.replace(";", ",").split(","):
              uf = parte.strip().upper()
              if len(uf) == 2 and uf not in solicitadas:
                  solicitadas.append(uf)

          if solicitadas:
              ufs = [uf for uf in disponiveis if uf in solicitadas]
              ausentes = [uf for uf in solicitadas if uf not in disponiveis]
              if ausentes:
                  print(f"::warning::UFs solicitadas sem cliente ativo na carteira: {', '.join(ausentes)}")
          else:
              ufs = disponiveis

          if not ufs:
              raise SystemExit("Nenhuma UF com cliente ativo foi encontrada na carteira do Maurício.")

          texto = ",".join(ufs)
          print(f"UFs detectadas automaticamente: {texto}")
          saida = Path(os.environ["GITHUB_OUTPUT"])
          with saida.open("a", encoding="utf-8") as arquivo:
              arquivo.write("ufs_json=" + json.dumps(ufs, separators=(",", ":")) + "\n")
              arquivo.write("ufs_texto=" + texto + "\n")
          PY

  extrair_uf:
    if: ${{ inputs.acao == 'atualizar_mercadofarma_paralelo' }}
    needs: preparar_ufs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        uf: ${{ fromJSON(needs.preparar_ufs.outputs.ufs_json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar janela da UF (07h-20h, Brasília)
        run: python scripts/janela_mercadofarma.py --check

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnosticar navegador
        run: |
          which google-chrome || true
          google-chrome --version || true
          which chromedriver || true
          chromedriver --version || true

      - name: Carregar acesso pessoal do Mercado Farma
        env:
          PAINEL_URL: https://painel-equipe-norte.pages.dev
          PAINEL_ADMIN_KEY: ${{ secrets.PAINEL_ADMIN_KEY }}
          MERCADOFARMA_USUARIO_SECRET: ${{ secrets.MERCADOFARMA_USUARIO }}
          MERCADOFARMA_SENHA_SECRET: ${{ secrets.MERCADOFARMA_SENHA }}
        shell: bash
        run: |
          set -euo pipefail

          USUARIO=""
          SENHA=""
          HTTP=$(curl --silent --show-error \
            --output /tmp/mercadofarma-credencial.json \
            --write-out '%{http_code}' \
            --header "x-admin-key: ${PAINEL_ADMIN_KEY}" \
            "${PAINEL_URL}/api/internal/mercado-farma-credencial" || true)

          if [ "$HTTP" = "200" ]; then
            USUARIO=$(jq -r '.usuario // empty' /tmp/mercadofarma-credencial.json)
            SENHA=$(jq -r '.segredo // empty' /tmp/mercadofarma-credencial.json)
            echo "Credencial pessoal carregada do Turso."
          else
            echo "::warning::Credencial pessoal não encontrada no Turso (HTTP ${HTTP}). Tentando Secrets do GitHub."
            USUARIO="${MERCADOFARMA_USUARIO_SECRET:-}"
            SENHA="${MERCADOFARMA_SENHA_SECRET:-}"
          fi

          if [ -n "$USUARIO" ] && [ -n "$SENHA" ]; then
            echo "::add-mask::$USUARIO"
            echo "::add-mask::$SENHA"
            echo "MERCADOFARMA_USUARIO=$USUARIO" >> "$GITHUB_ENV"
            echo "MERCADOFARMA_SENHA=$SENHA" >> "$GITHUB_ENV"
          else
            echo "::warning::Credencial não está no Turso/Secrets; a extração usará o acesso legado criptografado do app-storage."
          fi

      - name: Extrair UF ${{ matrix.uf }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          GITHUB_STORAGE_BRANCH: app-storage
          PERSISTENCE_KEY: ${{ secrets.PERSISTENCE_KEY || inputs.persistence_key }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE: painel-equipe-norte-db
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$MERCADOFARMA_USUARIO" ]; then echo "::add-mask::$MERCADOFARMA_USUARIO"; fi
          if [ -n "$MERCADOFARMA_SENHA" ]; then echo "::add-mask::$MERCADOFARMA_SENHA"; fi
          if [ -n "$PERSISTENCE_KEY" ]; then echo "::add-mask::$PERSISTENCE_KEY"; fi
          EXTRA_ARGS=""
          if [ "${{ inputs.headless }}" = "false" ]; then EXTRA_ARGS="--visivel"; fi
          if [ -f "config/turso-cutover-active.txt" ]; then
            test -n "${TURSO_DATABASE_URL:-}"
            test -n "${TURSO_AUTH_TOKEN:-}"
            echo "Mercado Farma sincronizando no Turso."
            PROGRAMA="automacoes/mercadofarma_turso_atualizado.py"
          else
            echo "Cutover Turso ainda não ativo; Mercado Farma sincronizando no D1."
            PROGRAMA="automacoes/mercadofarma_atualizado.py"
          fi
          # Interrompe também um Selenium bloqueado, antes das 20h.
          if ! TEMPO_RESTANTE=$(python scripts/janela_mercadofarma.py --seconds); then
            python scripts/janela_mercadofarma.py --registrar-interrupcao "${{ matrix.uf }}"
            exit 2
          fi
          set +e
          timeout --signal=TERM --kill-after=10 "${TEMPO_RESTANTE}s" python "$PROGRAMA" --uf "${{ matrix.uf }}" --limite-eans "${{ inputs.limite_eans || '0' }}" $EXTRA_ARGS
          CODIGO=$?
          set -e
          if [ "$CODIGO" -eq 124 ] || [ "$CODIGO" -eq 137 ]; then
            python scripts/janela_mercadofarma.py --registrar-interrupcao "${{ matrix.uf }}"
            echo "::error::UF ${{ matrix.uf }}: interrompida antes das 20h para respeitar o bloqueio noturno."
          fi
          exit "$CODIGO"

      - name: Publicar artifact da UF ${{ matrix.uf }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercadofarma-${{ matrix.uf }}
          if-no-files-found: ignore
          path: |
            data/mercadofarma/parciais/mercadofarma_${{ matrix.uf }}.csv
            data/mercadofarma/status/mercadofarma_${{ matrix.uf }}.json
            data/mercadofarma/debug/${{ matrix.uf }}/**

  consolidar_mercadofarma:
    if: ${{ always() && needs.preparar_ufs.result == 'success' && inputs.acao == 'atualizar_mercadofarma_paralelo' }}
    runs-on: ubuntu-latest
    needs: [preparar_ufs, extrair_uf]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE: painel-equipe-norte-db
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests

      - name: Baixar artifacts das UFs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: mercadofarma-*
          merge-multiple: true
          path: data/mercadofarma/parciais

      - name: Consolidar Mercado Farma
        run: python scripts/consolidar_mercadofarma.py

      - name: Disponibilizar Excel no painel
        run: |
          mkdir -p web/public/exports
          cp data/mercadofarma/mercadofarma_consolidado.xlsx web/public/exports/mercadofarma.xlsx

      - name: Sincronizar somente produtos autorizados no banco principal
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "config/turso-cutover-active.txt" ]; then
            test -n "${TURSO_DATABASE_URL:-}"
            test -n "${TURSO_AUTH_TOKEN:-}"
            python scripts/importar_mercadofarma_turso_filtrado.py
          else
            python scripts/importar_mercadofarma_d1_filtrado.py
          fi

      - name: Salvar consolidado no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/mercadofarma web/public/exports
          if git diff --staged --quiet; then
            echo "Nenhuma alteracao para publicar."
          else
            git commit -m "Atualiza Mercado Farma consolidado"
            git pull --rebase origin main
            git push
          fi

  finalizar_comando:
    if: ${{ always() && inputs.command_id != '' }}
    needs: [preparar_ufs, extrair_uf, consolidar_mercadofarma]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar relatórios individuais das UFs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: mercadofarma-*
          merge-multiple: true
          path: /tmp/mercadofarma-artifacts

      - name: Atualizar solicitação no painel com diagnostico por UF
        env:
          PAINEL_URL: https://painel-equipe-norte.pages.dev
          PAINEL_ADMIN_KEY: ${{ secrets.PAINEL_ADMIN_KEY }}
          COMMAND_ID: ${{ inputs.command_id }}
          RESULTADO_EXTRACAO: ${{ needs.extrair_uf.result }}
          RESULTADO_CONSOLIDACAO: ${{ needs.consolidar_mercadofarma.result }}
          UFS_EXTRAIDAS: ${{ needs.preparar_ufs.outputs.ufs_texto }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/resumir_mercadofarma_ufs.py \
            --ufs "$UFS_EXTRAIDAS" \
            --extracao "$RESULTADO_EXTRACAO" \
            --consolidacao "$RESULTADO_CONSOLIDACAO" > resultado_ufs.json
          jq -n \
            --arg id "$COMMAND_ID" \
            --slurpfile resultado resultado_ufs.json \
            '{acao:"finalizar",id:$id,status:$resultado[0].status,mensagem:$resultado[0].mensagem,erro:$resultado[0].erro}' > finalizar.json
          jq '{status, mensagem, erro}' resultado_ufs.json
          curl --fail-with-body --silent --show-error \
            --request POST "${PAINEL_URL}/api/internal/automacoes" \
            --header "x-admin-key: ${PAINEL_ADMIN_KEY}" \
            --header "content-type: application/json" \
            --data @finalizar.json
