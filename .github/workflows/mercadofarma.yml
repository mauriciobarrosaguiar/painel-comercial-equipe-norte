name: Mercado Farma por UF
run-name: Mercado Farma / ${{ inputs.acao || 'atualizar_mercadofarma_paralelo' }} / ${{ inputs.ufs || inputs.uf || 'todas' }}

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mercadofarma.yml
      - automacoes/mercadofarma_atualizado.py
      - src/mercadofarma_parser_atual.py
  workflow_dispatch:
    inputs:
      acao:
        description: "Acao solicitada pelo painel"
        required: true
        default: "atualizar_mercadofarma_paralelo"
      ufs:
        description: "UFs separadas por virgula. Vazio executa todas."
        required: false
        default: "MA,MT,PA,PI,TO"
      uf:
        description: "Compatibilidade: UF ou UFs separadas por virgula."
        required: false
        default: ""
      limite_eans:
        description: "Limite de EANs para teste. 0 executa todos."
        required: false
        default: "0"
      command_id:
        description: "Identificador do disparo pelo painel"
        required: false
        default: ""
      headless:
        description: "Rodar navegador oculto"
        required: false
        default: "true"
      mercadofarma_usuario:
        description: "Usuario GD Mercado Farma enviado pelo painel"
        required: false
        default: ""
      mercadofarma_senha:
        description: "Senha GD Mercado Farma enviada pelo painel"
        required: false
        default: ""
      persistence_key:
        description: "Chave de persistencia enviada pelo painel"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: mercado-farma-atualizacao
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  extrair_uf:
    if: ${{ github.event_name == 'push' || inputs.acao == 'atualizar_mercadofarma_paralelo' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        uf: [MA, MT, PA, PI, TO]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnosticar navegador
        run: |
          which google-chrome || true
          google-chrome --version || true
          which chromedriver || true
          chromedriver --version || true

      - name: Extrair UF ${{ matrix.uf }}
        if: ${{ github.event_name == 'push' || (inputs.ufs == '' && inputs.uf == '') || contains(inputs.ufs, matrix.uf) || contains(inputs.uf, matrix.uf) }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          GITHUB_STORAGE_BRANCH: app-storage
          PERSISTENCE_KEY: ${{ secrets.PERSISTENCE_KEY || inputs.persistence_key }}
          MERCADOFARMA_USUARIO: ${{ secrets.MERCADOFARMA_USUARIO || inputs.mercadofarma_usuario }}
          MERCADOFARMA_SENHA: ${{ secrets.MERCADOFARMA_SENHA || inputs.mercadofarma_senha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE: painel-equipe-norte-db
        run: |
          if [ -n "$MERCADOFARMA_USUARIO" ]; then echo "::add-mask::$MERCADOFARMA_USUARIO"; fi
          if [ -n "$MERCADOFARMA_SENHA" ]; then echo "::add-mask::$MERCADOFARMA_SENHA"; fi
          if [ -n "$PERSISTENCE_KEY" ]; then echo "::add-mask::$PERSISTENCE_KEY"; fi
          EXTRA_ARGS=""
          if [ "${{ inputs.headless }}" = "false" ]; then EXTRA_ARGS="--visivel"; fi
          python automacoes/mercadofarma_atualizado.py --uf "${{ matrix.uf }}" --limite-eans "${{ inputs.limite_eans || '0' }}" $EXTRA_ARGS

      - name: Publicar artifact da UF ${{ matrix.uf }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercadofarma-${{ matrix.uf }}
          if-no-files-found: ignore
          path: |
            data/mercadofarma/parciais/mercadofarma_${{ matrix.uf }}.csv
            data/mercadofarma/status/mercadofarma_${{ matrix.uf }}.json
            data/mercadofarma/debug/${{ matrix.uf }}/**

  consolidar_mercadofarma:
    if: ${{ always() && (github.event_name == 'push' || inputs.acao == 'atualizar_mercadofarma_paralelo') }}
    runs-on: ubuntu-latest
    needs: extrair_uf
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE: painel-equipe-norte-db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests

      - name: Baixar artifacts das UFs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: mercadofarma-*
          merge-multiple: true
          path: data/mercadofarma/parciais

      - name: Consolidar Mercado Farma
        run: python scripts/consolidar_mercadofarma.py

      - name: Disponibilizar Excel no painel
        run: |
          mkdir -p web/public/exports
          cp data/mercadofarma/mercadofarma_consolidado.xlsx web/public/exports/mercadofarma.xlsx

      - name: Sincronizar consolidado no D1
        run: python scripts/importar_mercadofarma_d1.py

      - name: Salvar consolidado no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/mercadofarma web/public/exports
          if git diff --staged --quiet; then
            echo "Nenhuma alteracao para publicar."
          else
            git commit -m "Atualiza Mercado Farma consolidado"
            git pull --rebase origin main
            git push
          fi

  finalizar_comando:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.command_id != '' }}
    needs: [extrair_uf, consolidar_mercadofarma]
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar solicitação no painel
        env:
          PAINEL_URL: https://painel-equipe-norte.pages.dev
          PAINEL_ADMIN_KEY: ${{ secrets.PAINEL_ADMIN_KEY }}
          COMMAND_ID: ${{ inputs.command_id }}
          RESULTADO_EXTRACAO: ${{ needs.extrair_uf.result }}
          RESULTADO_CONSOLIDACAO: ${{ needs.consolidar_mercadofarma.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RESULTADO_EXTRACAO" = "success" ] && [ "$RESULTADO_CONSOLIDACAO" = "success" ]; then
            STATUS="concluido"
            MENSAGEM="Extração do Mercado Farma concluída, consolidada e sincronizada no painel."
            ERRO=""
          else
            STATUS="erro"
            MENSAGEM=""
            ERRO="Mercado Farma terminou com extração=${RESULTADO_EXTRACAO} e consolidação=${RESULTADO_CONSOLIDACAO}. Consulte o GitHub Actions para os detalhes."
          fi
          jq -n \
            --arg id "$COMMAND_ID" \
            --arg status "$STATUS" \
            --arg mensagem "$MENSAGEM" \
            --arg erro "$ERRO" \
            '{acao:"finalizar",id:$id,status:$status,mensagem:$mensagem,erro:$erro}' > finalizar.json
          curl --fail-with-body --silent --show-error \
            --request POST "${PAINEL_URL}/api/internal/automacoes" \
            --header "x-admin-key: ${PAINEL_ADMIN_KEY}" \
            --header "content-type: application/json" \
            --data @finalizar.json
