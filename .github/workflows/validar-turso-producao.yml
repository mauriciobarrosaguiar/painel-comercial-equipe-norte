name: Validar Turso em produção

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validar-turso-producao.yml"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    env:
      PAINEL_ADMIN_KEY: ${{ secrets.PAINEL_ADMIN_KEY }}
    steps:
      - name: Consultar diagnóstico Turso
        shell: bash
        run: |
          set -euo pipefail
          # Esta validação também serve como barreira de corte: o painel só pode
          # trocar o D1 pelo Turso depois que pedidos e itens estiverem carregados.
          URL="https://painel-equipe-norte.pages.dev/api/turso-health"
          if [ -z "${PAINEL_ADMIN_KEY:-}" ]; then
            echo "::error::PAINEL_ADMIN_KEY ausente."
            exit 1
          fi
          for tentativa in 1 2 3 4 5 6; do
            STATUS=$(curl --silent --show-error \
              --header "x-admin-key: ${PAINEL_ADMIN_KEY}" \
              --output resposta.json \
              --write-out '%{http_code}' \
              "$URL" || true)
            echo "Tentativa ${tentativa}: HTTP ${STATUS}"
            cat resposta.json || true
            echo
            if [ "$STATUS" = "200" ] && jq -e '
              .ok == true
              and .backend == "turso"
              and .env_db_mutavel == true
              and (.tabelas | tonumber) > 0
              and (.clientes | tonumber) > 0
              and (.produtos | tonumber) > 0
              and (.pedidos | tonumber) > 0
              and (.itens_pedido | tonumber) > 0
            ' resposta.json >/dev/null 2>&1; then
              jq . resposta.json
              exit 0
            fi
            sleep 10
          done
          echo "::error::O Turso ainda não recebeu os pedidos e itens necessários para assumir a produção."
          exit 1
