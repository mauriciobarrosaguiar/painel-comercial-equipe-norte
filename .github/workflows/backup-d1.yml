name: Backup manual do D1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Localizar banco D1
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.112.0 d1 list --json > d1-list.json
          node <<'NODE'
          const fs = require('fs')
          const data = JSON.parse(fs.readFileSync('d1-list.json', 'utf8'))
          const databases = Array.isArray(data) ? data : (Array.isArray(data.result) ? data.result : [])
          const database = databases.find((item) => item && item.name === 'painel-equipe-norte-db')
          const databaseId = database?.uuid || database?.database_id || database?.id
          if (!databaseId) throw new Error('Banco painel-equipe-norte-db não encontrado.')
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'))
          config.d1_databases[0].database_id = databaseId
          fs.writeFileSync('wrangler.jsonc', `${JSON.stringify(config, null, 2)}\n`)
          NODE

      - name: Exportar esquema e dados
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../backup-d1
          arquivo="painel-equipe-norte-db_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.sql"
          npx wrangler@4.112.0 d1 export DB --remote --config wrangler.jsonc --output "../backup-d1/${arquivo}"
          sha256sum "../backup-d1/${arquivo}" > "../backup-d1/${arquivo}.sha256"
          printf 'commit=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > ../backup-d1/manifest.txt

      - name: Guardar backup protegido no GitHub
        uses: actions/upload-artifact@v4
        with:
          name: backup-d1-${{ github.run_id }}-${{ github.run_attempt }}
          path: backup-d1/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
