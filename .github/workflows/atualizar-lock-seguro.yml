name: Atualizar lock seguro do Wrangler

on:
  push:
    branches:
      - fix/disparo-imediato-automacoes
    paths:
      - .github/workflows/atualizar-lock-seguro.yml

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: fix/disparo-imediato-automacoes
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Atualizar Wrangler e dependências corrigidas
        working-directory: web
        run: npm update wrangler --package-lock-only --ignore-scripts
      - name: Confirmar auditoria
        working-directory: web
        run: npm audit --audit-level=high
      - name: Salvar lock atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          if git diff --staged --quiet; then
            echo "O lock já estava atualizado."
          else
            git commit -m "Atualiza Wrangler e corrige dependências vulneráveis"
            git push origin HEAD:fix/disparo-imediato-automacoes
          fi
