name: Mercado Farma - Pedidos dos clientes
run-name: Pedidos clientes / ${{ inputs.inicio }} a ${{ inputs.fim }} / ${{ inputs.ufs || 'todas' }}

on:
  workflow_dispatch:
    inputs:
      inicio:
        description: "Data inicial (AAAA-MM-DD)"
        required: true
      fim:
        description: "Data final (AAAA-MM-DD)"
        required: true
      ufs:
        description: "UFs separadas por virgula"
        required: false
        default: "MA,MT,PA,PI,TO"
      command_id:
        description: "Identificador do disparo pelo painel"
        required: false
        default: ""
      limite_clientes:
        description: "Limite de clientes para teste. 0 executa todos."
        required: false
        default: "0"
      headless:
        description: "Rodar navegador oculto"
        required: false
        default: "true"

permissions:
  contents: read
  actions: read

concurrency:
  group: mercado-farma-pedidos-clientes
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        uf: [MA, MT, PA, PI, TO]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnosticar navegador
        run: |
          which google-chrome || true
          google-chrome --version || true
          which chromedriver || true
          chromedriver --version || true

      - name: Extrair pedidos de ${{ matrix.uf }}
        if: ${{ inputs.ufs == '' || contains(inputs.ufs, matrix.uf) }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          MERCADOFARMA_USUARIO: ${{ secrets.MERCADOFARMA_USUARIO }}
          MERCADOFARMA_SENHA: ${{ secrets.MERCADOFARMA_SENHA }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE: painel-equipe-norte-db
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$MERCADOFARMA_USUARIO" ]; then echo "::add-mask::$MERCADOFARMA_USUARIO"; fi
          if [ -n "$MERCADOFARMA_SENHA" ]; then echo "::add-mask::$MERCADOFARMA_SENHA"; fi
          EXTRA_ARGS=""
          if [ "${{ inputs.headless }}" = "false" ]; then EXTRA_ARGS="--visivel"; fi
          python automacoes/mercadofarma_pedidos_clientes.py             --uf "${{ matrix.uf }}"             --inicio "${{ inputs.inicio }}"             --fim "${{ inputs.fim }}"             --limite-clientes "${{ inputs.limite_clientes || '0' }}"             $EXTRA_ARGS

  finalizar_comando:
    if: ${{ always() && inputs.command_id != '' }}
    needs: [extrair]
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar solicitacao no painel
        env:
          PAINEL_URL: https://painel-equipe-norte.pages.dev
          PAINEL_ADMIN_KEY: ${{ secrets.PAINEL_ADMIN_KEY }}
          COMMAND_ID: ${{ inputs.command_id }}
          RESULTADO: ${{ needs.extrair.result }}
          INICIO: ${{ inputs.inicio }}
          FIM: ${{ inputs.fim }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RESULTADO" = "success" ]; then
            STATUS="concluido"
            MENSAGEM="Pedidos dos clientes extraídos e sincronizados no período ${INICIO} a ${FIM}."
            ERRO=""
          else
            STATUS="erro"
            MENSAGEM=""
            ERRO="A extração de pedidos dos clientes terminou com status ${RESULTADO}. Consulte o GitHub Actions para os detalhes."
          fi
          jq -n             --arg id "$COMMAND_ID"             --arg status "$STATUS"             --arg mensagem "$MENSAGEM"             --arg erro "$ERRO"             '{acao:"finalizar",id:$id,status:$status,mensagem:$mensagem,erro:$erro}' > finalizar.json
          curl --fail-with-body --silent --show-error             --request POST "${PAINEL_URL}/api/internal/automacoes"             --header "x-admin-key: ${PAINEL_ADMIN_KEY}"             --header "content-type: application/json"             --data @finalizar.json
