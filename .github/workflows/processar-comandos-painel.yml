name: Processar comandos do painel

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: comandos-painel
  cancel-in-progress: false

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar cliente HTTP
        run: python -m pip install requests

      - name: Processar próximo comando
        env:
          PAINEL_URL: https://painel-equipe-norte.pages.dev
          PAINEL_ADMIN_KEY: ${{ secrets.PAINEL_ADMIN_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/processar_comando_painel.py
