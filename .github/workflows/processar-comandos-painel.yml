name: Processar comandos do painel

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: comandos-painel-fallback
  cancel-in-progress: false

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAINEL_URL: https://painel-equipe-norte.pages.dev
      PAINEL_ADMIN_KEY: ${{ secrets.PAINEL_ADMIN_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Informar modo de contingência
        run: echo "Execução manual de contingência. O processamento automático ocorre no Cloudflare Worker."

      - name: Criar comandos automáticos vencidos
        shell: bash
        run: |
          set -u
          echo "Verificando intervalos configurados no painel..."
          if curl --fail-with-body --silent --show-error \
            --request POST "${PAINEL_URL}/api/internal/agendar-automacoes" \
            --header "x-admin-key: ${PAINEL_ADMIN_KEY}" \
            --header "content-type: application/json" \
            --data '{}' > agendamentos.json; then
            cat agendamentos.json
          else
            echo "::warning::Não foi possível consultar os intervalos agora. A fila existente continuará sendo processada pelo Cloudflare Worker."
          fi

      - name: Processar fila do painel
        shell: bash
        run: |
          set -u

          finalizar() {
            local id="$1"
            local status="$2"
            local mensagem="$3"
            local erro="$4"
            jq -n --arg id "$id" --arg status "$status" --arg mensagem "$mensagem" --arg erro "$erro" \
              '{acao:"finalizar",id:$id,status:$status,mensagem:$mensagem,erro:$erro}' > finalizar.json
            curl --fail-with-body --silent --show-error \
              --request POST "${PAINEL_URL}/api/internal/automacoes" \
              --header "x-admin-key: ${PAINEL_ADMIN_KEY}" \
              --header "content-type: application/json" \
              --data @finalizar.json
          }

          for tentativa in $(seq 1 10); do
            echo "Buscando comando ${tentativa}/10..."
            if ! curl --fail-with-body --silent --show-error \
              --request POST "${PAINEL_URL}/api/internal/automacoes" \
              --header "x-admin-key: ${PAINEL_ADMIN_KEY}" \
              --header "content-type: application/json" \
              --data '{"acao":"proxima"}' > comando.json; then
              echo "Não foi possível consultar a fila."
              exit 1
            fi

            id=$(jq -r '.comando.id // empty' comando.json)
            tipo=$(jq -r '.comando.tipo // empty' comando.json)
            if [ -z "$id" ]; then
              echo "Fila concluída."
              break
            fi

            jq -c '.comando.parametros // {}' comando.json > parametros.json
            ano_mes=$(jq -r '.ano_mes // empty' parametros.json)
            ufs=$(jq -r '.ufs // "MA,MT,PA,PI,TO"' parametros.json)
            mensagem=""
            acompanha_workflow="false"
            set +e
            case "$tipo" in
              BUSSOLA)
                saida=$(gh workflow run bussola-d1.yml --repo "$GITHUB_REPOSITORY" --ref main -f command_id="$id" 2>&1)
                codigo=$?
                mensagem="Extração manual do Bússola enviada ao GitHub Actions."
                acompanha_workflow="true"
                ;;
              MERCADO_FARMA)
                saida=$(gh workflow run mercadofarma.yml --repo "$GITHUB_REPOSITORY" --ref main -f acao=atualizar_mercadofarma_paralelo -f ufs="$ufs" -f command_id="$id" 2>&1)
                codigo=$?
                mensagem="Extração do Mercado Farma enviada para as UFs ${ufs}."
                acompanha_workflow="true"
                ;;
              MIGRAR_BASES)
                if [ -n "$ano_mes" ]; then
                  saida=$(gh workflow run migrar-bases-legadas-d1.yml --repo "$GITHUB_REPOSITORY" --ref main -f ano_mes="$ano_mes" 2>&1)
                else
                  saida=$(gh workflow run migrar-bases-legadas-d1.yml --repo "$GITHUB_REPOSITORY" --ref main 2>&1)
                fi
                codigo=$?
                mensagem="Migração das bases legadas enviada ao GitHub Actions."
                ;;
              FECHAMENTO_MENSAL)
                if [ -n "$ano_mes" ]; then
                  saida=$(gh workflow run fechamento-mensal.yml --repo "$GITHUB_REPOSITORY" --ref main -f ano_mes="$ano_mes" 2>&1)
                else
                  saida=$(gh workflow run fechamento-mensal.yml --repo "$GITHUB_REPOSITORY" --ref main 2>&1)
                fi
                codigo=$?
                mensagem="Fechamento mensal enviado ao GitHub Actions."
                ;;
              AUDITORIA)
                saida=$(curl --fail-with-body --silent --show-error --request POST \
                  "${PAINEL_URL}/api/admin/auditoria" \
                  --header "x-admin-key: ${PAINEL_ADMIN_KEY}" 2>&1)
                codigo=$?
                mensagem="Auditoria dos cálculos concluída."
                ;;
              *)
                saida="Tipo de automação não reconhecido: ${tipo}"
                codigo=2
                ;;
            esac
            set -e

            if [ "$codigo" -eq 0 ]; then
              if [ "$acompanha_workflow" = "true" ]; then
                echo "${mensagem} O próprio workflow atualizará o comando ao terminar."
              else
                finalizar "$id" "concluido" "$mensagem" ""
                echo "$mensagem"
              fi
            else
              erro=$(printf '%s' "$saida" | tail -c 3500)
              finalizar "$id" "erro" "" "$erro"
              echo "Falha no comando ${id}: ${erro}" >&2
            fi
          done
