name: Validar build Desafio de Gigantes

on:
  push:
    branches:
      - feature/desafio-gigantes-sap-v2

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci --ignore-scripts
      - working-directory: web
        run: npm run build
      - name: Validar sintaxe da rotina SAP
        run: python -m py_compile scripts/identificar_desafio_gigantes_sap.py
