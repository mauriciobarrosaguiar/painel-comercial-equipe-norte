name: Validar hotfix SIP

on:
  push:
    branches:
      - hotfix-fase-4-sip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Executar teste isolado
        id: teste
        shell: bash
        run: |
          set +e
          node --test tests/sips-phase4.test.js 2>&1 | tee sip-test-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: resultado-hotfix-sip-${{ github.run_id }}
          path: web/sip-test-output.txt
          retention-days: 3
      - name: Falhar se necessário
        if: steps.teste.outputs.status != '0'
        run: exit 1
