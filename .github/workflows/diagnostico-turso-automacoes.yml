name: Diagnostico Turso automacoes

on:
  push:
    branches:
      - diagnostico-turso-automacoes
    paths:
      - ".github/workflows/diagnostico-turso-automacoes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar requests
        run: python -m pip install --disable-pip-version-check "requests>=2.34,<3"

      - name: Testar endpoints internos de produção e mostrar erro
        env:
          PAINEL_ADMIN_KEY: ${{ secrets.PAINEL_ADMIN_KEY }}
        shell: bash
        run: |
          set -u
          for endpoint in agendar-automacoes automacoes; do
            echo "=== $endpoint ==="
            if [ "$endpoint" = "agendar-automacoes" ]; then
              body='{}'
            else
              body='{"acao":"proxima"}'
            fi
            status=$(curl --silent --show-error \
              --request POST "https://painel-equipe-norte.pages.dev/api/internal/$endpoint" \
              --header "x-admin-key: ${PAINEL_ADMIN_KEY}" \
              --header "content-type: application/json" \
              --data "$body" \
              --dump-header /tmp/headers.txt \
              --output /tmp/body.txt \
              --write-out "%{http_code}")
            echo "HTTP $status"
            grep -i '^x-db-backend:' /tmp/headers.txt || true
            cat /tmp/body.txt
            echo
          done

      - name: Testar leitura e escrita inofensiva no D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, requests
          account=(os.environ.get("CLOUDFLARE_ACCOUNT_ID") or "").strip()
          token=(os.environ.get("CLOUDFLARE_API_TOKEN") or "").strip()
          headers={"authorization":f"Bearer {token}","content-type":"application/json"}
          base=f"https://api.cloudflare.com/client/v4/accounts/{account}/d1/database"
          r=requests.get(base,headers=headers,params={"per_page":100},timeout=60)
          print("LIST HTTP",r.status_code)
          data=r.json()
          if not r.ok: raise SystemExit(json.dumps(data)[:4000])
          db=next((x for x in data.get("result") or [] if x.get("name")=="painel-equipe-norte-db"),None)
          if not db: raise SystemExit("D1 painel-equipe-norte-db não encontrado")
          dbid=db.get("uuid") or db.get("id")
          q=f"{base}/{dbid}/query"
          tests=[
            ("READ","SELECT COUNT(*) total FROM comandos_automacao",[]),
            ("CREDENTIAL_NAMES","SELECT integracao,status,usuario_mascarado,atualizado_em FROM integracao_credenciais WHERE integracao IN ('BUSSOLA_MAURICIO','MERCADO_FARMA_MAURICIO') ORDER BY integracao",[]),
            ("AUTOMATION_CONFIG","SELECT tipo,ativo,intervalo_minutos,parametros_json FROM configuracoes_automacao ORDER BY tipo",[]),
            ("PERSONAL_COUNTS","SELECT (SELECT COUNT(*) FROM consultores WHERE ativo=1) consultores_ativos,(SELECT COUNT(*) FROM colaboradores_acesso WHERE ativo=1) acessos_ativos,(SELECT COUNT(*) FROM clientes WHERE ativo=1 AND carteira_importada=1) clientes_ativos",[]),
            ("WRITE_ZERO","UPDATE configuracoes_automacao SET atualizado_em=atualizado_em WHERE tipo='__DIAGNOSTICO_INEXISTENTE__'",[]),
          ]
          for label,sql,params in tests:
              rr=requests.post(q,headers=headers,json={"sql":sql,"params":params},timeout=60)
              print(label,"HTTP",rr.status_code)
              body=rr.json()
              print(json.dumps(body,ensure_ascii=False)[:5000])
          PY

      - name: Consultar somente schema das automacoes
        shell: bash
        run: |
          python - <<'PY'
          import json, os, requests, sys

          raw = (os.environ.get("TURSO_DATABASE_URL") or "").strip()
          token = (os.environ.get("TURSO_AUTH_TOKEN") or "").strip()
          if not raw or not token:
              raise SystemExit("Credenciais Turso ausentes")
          url = raw.replace("libsql://","https://").replace("turso://","https://").rstrip("/") + "/v2/pipeline"
          headers = {"authorization": f"Bearer {token}", "content-type": "application/json"}

          sqls = [
              "SELECT name,sql FROM sqlite_master WHERE type='table' AND name IN ('comandos_automacao','configuracoes_automacao') ORDER BY name",
              "PRAGMA table_info(comandos_automacao)",
              "PRAGMA table_info(configuracoes_automacao)",
              "SELECT COUNT(*) AS total FROM comandos_automacao",
              "SELECT COUNT(*) AS total FROM configuracoes_automacao",
              "SELECT integracao,status,usuario_mascarado,atualizado_em FROM integracao_credenciais WHERE integracao IN ('BUSSOLA_MAURICIO','MERCADO_FARMA_MAURICIO') ORDER BY integracao",
              "SELECT tipo,ativo,intervalo_minutos,parametros_json FROM configuracoes_automacao ORDER BY tipo",
              "SELECT (SELECT COUNT(*) FROM consultores WHERE ativo=1) consultores_ativos,(SELECT COUNT(*) FROM colaboradores_acesso WHERE ativo=1) acessos_ativos,(SELECT COUNT(*) FROM clientes WHERE ativo=1 AND carteira_importada=1) clientes_ativos",
          ]
          payload = {"requests":[{"type":"execute","stmt":{"sql":sql}} for sql in sqls] + [{"type":"close"}]}
          response = requests.post(url, headers=headers, json=payload, timeout=60)
          print("HTTP", response.status_code)
          data = response.json()
          if not response.ok:
              print(json.dumps(data, ensure_ascii=False, indent=2)[:12000])
              raise SystemExit(2)

          def decode(cell):
              if not isinstance(cell,dict) or cell.get("type")=="null": return None
              return cell.get("value")
          for idx,item in enumerate(data.get("results",[])[:-1]):
              print(f"--- QUERY {idx+1} ---")
              if item.get("type")!="ok":
                  print(json.dumps(item,ensure_ascii=False,indent=2))
                  continue
              result=(item.get("response") or {}).get("result") or {}
              cols=[c.get("name") for c in result.get("cols") or []]
              print("COLS", cols)
              for row in result.get("rows") or []:
                  print(dict(zip(cols,[decode(c) for c in row])))
          PY
