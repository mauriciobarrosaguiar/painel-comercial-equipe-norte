name: Diagnostico Desafio Zero
on:
  push:
    branches: [diag/desafio-zero]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Consultar D1
        run: |
          set -e
          echo '=== EAN DUPLICADO/VAZIO ==='
          npx --yes wrangler@4 d1 execute painel-equipe-norte-db --remote --json --command "SELECT COALESCE(ean,'') ean,GROUP_CONCAT(DISTINCT sku) saps,GROUP_CONCAT(DISTINCT COALESCE(produto_identificado,produto_planilha,'')) produtos,COUNT(DISTINCT sku) qtd_saps FROM desafio_gigantes_metas WHERE ano_mes='2026-08' GROUP BY COALESCE(ean,'') HAVING TRIM(COALESCE(ean,''))='' OR COUNT(DISTINCT sku)>1 ORDER BY qtd_saps DESC;"
          echo '=== GIRO BRUTO CONSULTOR ==='
          npx --yes wrangler@4 d1 execute painel-equipe-norte-db --remote --json --command "WITH vendas_pdv AS (SELECT TRIM(ip.ean) ean,cl.id cliente_id,cl.consultor_id,SUM(COALESCE(ip.quantidade_faturada,0)) unidades FROM itens_pedido ip JOIN pedidos pe ON pe.id=ip.pedido_id JOIN clientes cl ON cl.id=pe.cliente_id WHERE pe.ativo=1 AND ip.ativo=1 AND UPPER(TRIM(COALESCE(pe.status,''))) IN ('FATURADO','FATURADO PARCIAL','FATURADO RECUPERADO') AND DATE(COALESCE(pe.data_faturamento,pe.data_pedido)) BETWEEN DATE('2026-08-01') AND DATE('2026-08-31') AND cl.carteira_importada=1 AND cl.ativo=1 AND COALESCE(ip.quantidade_faturada,0)<>0 GROUP BY TRIM(ip.ean),cl.id,cl.consultor_id), por_sku AS (SELECT m.nome_colaborador,m.sku,m.meta_positivacao,m.meta_giro,COUNT(DISTINCT CASE WHEN v.unidades>0 THEN v.cliente_id END) pos,COALESCE(SUM(CASE WHEN v.unidades>0 THEN v.unidades ELSE 0 END),0) un FROM desafio_gigantes_metas m LEFT JOIN vendas_pdv v ON v.ean=TRIM(COALESCE(m.ean,'')) AND v.consultor_id=m.consultor_id WHERE m.ano_mes='2026-08' AND m.escopo='consultor' GROUP BY m.id), calc AS (SELECT *,CASE WHEN meta_positivacao>0 THEN pos*100.0/meta_positivacao ELSE 0 END pos_pct,CASE WHEN pos>0 AND meta_giro>0 THEN (un*1.0/pos)*100.0/meta_giro ELSE 0 END giro_pct FROM por_sku) SELECT nome_colaborador,SUM(CASE WHEN giro_pct>=100 THEN 1 ELSE 0 END) giro_bruto_100,SUM(CASE WHEN giro_pct>=120 THEN 1 ELSE 0 END) giro_bruto_120,SUM(CASE WHEN pos_pct>=80 THEN 1 ELSE 0 END) pos80,SUM(CASE WHEN pos_pct>=80 AND giro_pct>=100 THEN 1 ELSE 0 END) giro_pontuando FROM calc GROUP BY nome_colaborador ORDER BY nome_colaborador;"
          echo '=== GIRO BRUTO GD ==='
          npx --yes wrangler@4 d1 execute painel-equipe-norte-db --remote --json --command "WITH vendas_pdv AS (SELECT TRIM(ip.ean) ean,cl.id cliente_id,UPPER(TRIM(COALESCE(cl.nome_gd,''))) nome_gd,SUM(COALESCE(ip.quantidade_faturada,0)) unidades FROM itens_pedido ip JOIN pedidos pe ON pe.id=ip.pedido_id JOIN clientes cl ON cl.id=pe.cliente_id WHERE pe.ativo=1 AND ip.ativo=1 AND UPPER(TRIM(COALESCE(pe.status,''))) IN ('FATURADO','FATURADO PARCIAL','FATURADO RECUPERADO') AND DATE(COALESCE(pe.data_faturamento,pe.data_pedido)) BETWEEN DATE('2026-08-01') AND DATE('2026-08-31') AND cl.carteira_importada=1 AND cl.ativo=1 AND COALESCE(ip.quantidade_faturada,0)<>0 GROUP BY TRIM(ip.ean),cl.id,UPPER(TRIM(COALESCE(cl.nome_gd,'')))), por_sku AS (SELECT m.nome_colaborador,m.sku,m.meta_positivacao,m.meta_giro,COUNT(DISTINCT CASE WHEN v.unidades>0 THEN v.cliente_id END) pos,COALESCE(SUM(CASE WHEN v.unidades>0 THEN v.unidades ELSE 0 END),0) un FROM desafio_gigantes_metas m LEFT JOIN vendas_pdv v ON v.ean=TRIM(COALESCE(m.ean,'')) AND v.nome_gd=UPPER(TRIM(COALESCE(m.nome_colaborador,''))) WHERE m.ano_mes='2026-08' AND m.escopo='gerente' GROUP BY m.id), calc AS (SELECT *,CASE WHEN meta_positivacao>0 THEN pos*100.0/meta_positivacao ELSE 0 END pos_pct,CASE WHEN pos>0 AND meta_giro>0 THEN (un*1.0/pos)*100.0/meta_giro ELSE 0 END giro_pct FROM por_sku) SELECT nome_colaborador,SUM(CASE WHEN giro_pct>=100 THEN 1 ELSE 0 END) giro_bruto_100,SUM(CASE WHEN giro_pct>=120 THEN 1 ELSE 0 END) giro_bruto_120,SUM(CASE WHEN pos_pct>=80 THEN 1 ELSE 0 END) pos80,SUM(CASE WHEN pos_pct>=80 AND giro_pct>=100 THEN 1 ELSE 0 END) giro_pontuando FROM calc GROUP BY nome_colaborador;"
