name: Diagnostico Desafio Zero
on:
  push:
    branches: [diag/desafio-zero]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Consultar D1
        run: |
          set -e
          echo '=== EANS CORRIGIDOS ==='
          npx --yes wrangler@4 d1 execute painel-equipe-norte-db --remote --json --command "SELECT sku,ean,produto,status,mensagem FROM desafio_gigantes_produtos WHERE sku IN ('11081','37606') ORDER BY sku;"
          echo '=== DUPLICIDADES RESTANTES ==='
          npx --yes wrangler@4 d1 execute painel-equipe-norte-db --remote --json --command "SELECT TRIM(ean) ean,GROUP_CONCAT(DISTINCT sku) saps,COUNT(DISTINCT sku) qtd_saps FROM desafio_gigantes_metas WHERE ano_mes='2026-08' AND TRIM(COALESCE(ean,''))<>'' GROUP BY TRIM(ean) HAVING COUNT(DISTINCT sku)>1 ORDER BY ean;"
          echo '=== TOTAL EANS AGOSTO ==='
          npx --yes wrangler@4 d1 execute painel-equipe-norte-db --remote --json --command "SELECT COUNT(DISTINCT sku) skus,COUNT(DISTINCT NULLIF(TRIM(ean),'')) eans FROM desafio_gigantes_metas WHERE ano_mes='2026-08';"
