name: Migrar D1 para Turso e ativar cutover

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Digite MIGRAR_D1_PARA_TURSO para executar o cutover"
        required: true
        default: ""
  push:
    branches:
      - main
    paths:
      - "config/turso-cutover-trigger.txt"

permissions:
  contents: write

concurrency:
  group: migracao-d1-turso
  cancel-in-progress: false

jobs:
  migrar:
    if: ${{ github.event_name == 'push' || inputs.confirmacao == 'MIGRAR_D1_PARA_TURSO' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE: painel-equipe-norte-db
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar cliente HTTP
        run: python -m pip install --disable-pip-version-check "requests>=2.34,<3"

      - name: Validar credenciais obrigatórias
        shell: bash
        run: |
          set -euo pipefail
          for nome in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN TURSO_DATABASE_URL TURSO_AUTH_TOKEN; do
            if [ -z "${!nome:-}" ]; then
              echo "::error::Secret obrigatório ausente: ${nome}"
              exit 1
            fi
          done

      - name: Confirmar que o Turso aceita escrita real
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from scripts import turso_backend as turso

          db = turso.database_id()
          turso.executar(db, "CREATE TABLE IF NOT EXISTS __cutover_probe (id TEXT PRIMARY KEY, criado_em TEXT)")
          turso.executar(db, "INSERT OR REPLACE INTO __cutover_probe(id,criado_em) VALUES(?,CURRENT_TIMESTAMP)", ["cutover"])
          dados = turso.executar(db, "SELECT COUNT(*) AS total FROM __cutover_probe WHERE id=?", ["cutover"])
          total = int((turso.linhas(dados)[0] or {}).get("total") or 0)
          if total != 1:
              raise SystemExit("TURSO_WRITE_NOT_CONFIRMED")
          turso.executar(db, "DELETE FROM __cutover_probe WHERE id=?", ["cutover"])
          print("TURSO_WRITE_OK")
          PY

      - name: Validar sintaxe do migrador
        run: python -m py_compile scripts/migrar_d1_turso.py scripts/migrar_d1_turso_v2.py scripts/turso_backend.py

      - name: Copiar schema e dados atuais do D1 para o Turso
        run: python scripts/migrar_d1_turso_v2.py

      - name: Validar tabelas essenciais no Turso
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from scripts import turso_backend as turso

          db = turso.database_id()
          essenciais = [
              "clientes",
              "consultores",
              "acessos",
              "produtos",
              "pedidos",
              "itens_pedido",
              "metas",
              "sips",
              "configuracoes_automacao",
              "comandos_automacao",
          ]
          for tabela in essenciais:
              dados = turso.executar(db, f'SELECT COUNT(*) AS total FROM "{tabela}"')
              total = int((turso.linhas(dados)[0] or {}).get("total") or 0)
              print(f"{tabela}: {total}")
          print("TURSO_CORE_TABLES_OK")
          PY

      - name: Ativar marcador de cutover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p config
          printf 'turso\n' > config/turso-cutover-active.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/turso-cutover-active.txt
          if git diff --cached --quiet; then
            echo "Marcador de cutover já estava ativo."
          else
            git commit -m "cutover: ativar Turso como banco principal"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Resultado
        run: |
          echo "Migração validada. O marcador foi ativado e o deploy do painel fará a troca do backend para Turso."
