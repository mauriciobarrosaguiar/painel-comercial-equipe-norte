name: Validar painel em produção

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: validar-painel-producao
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PAINEL_URL: https://painel-equipe-norte.pages.dev
    steps:
      - name: Aguardar publicação do Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          pronto=0
          for tentativa in $(seq 1 48); do
            codigo=$(curl --silent --show-error --output session.json --write-out '%{http_code}' "${PAINEL_URL}/api/auth/session" || true)
            if [ "$codigo" = "401" ] && grep -q 'autenticado' session.json; then
              pronto=1
              break
            fi
            echo "Publicação ainda não disponível (${tentativa}/48, HTTP ${codigo})."
            sleep 10
          done
          if [ "$pronto" != "1" ]; then
            echo "A nova versão não ficou disponível no tempo esperado."
            exit 1
          fi

      - name: Validar página e instalação mobile
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "${PAINEL_URL}/" --output painel.html
          grep -q 'Painel Comercial' painel.html
          curl --fail --silent --show-error "${PAINEL_URL}/manifest.webmanifest" --output manifest.json
          grep -q 'Painel Comercial Equipe Norte' manifest.json

      - name: Validar acesso pessoal do Maurício
        shell: bash
        run: |
          set -euo pipefail
          pronto=0
          for tentativa in $(seq 1 36); do
            codigo=$(curl --silent --show-error \
              --cookie-jar cookies-m0043497.txt \
              --output login-mauricio.json \
              --write-out '%{http_code}' \
              --request POST "${PAINEL_URL}/api/auth/login" \
              --header 'content-type: application/json' \
              --data '{"login":"m0043497"}' || true)

            if [ "$codigo" = "200" ] && jq -e '.usuario.login=="m0043497" and .usuario.nome=="MAURICIO BARROS DE AGUIAR"' login-mauricio.json >/dev/null 2>&1; then
              pronto=1
              break
            fi
            echo "Aguardando acesso pessoal do Maurício (${tentativa}/36, HTTP ${codigo})."
            sleep 10
          done

          if [ "$pronto" != "1" ]; then
            echo "O acesso pessoal do Maurício não ficou disponível."
            cat login-mauricio.json || true
            exit 1
          fi

          codigo_bloqueado=$(curl --silent --show-error \
            --output login-outro.json \
            --write-out '%{http_code}' \
            --request POST "${PAINEL_URL}/api/auth/login" \
            --header 'content-type: application/json' \
            --data '{"login":"a0002958"}' || true)
          if [ "$codigo_bloqueado" != "401" ]; then
            echo "Um acesso antigo da equipe ainda está liberado."
            cat login-outro.json || true
            exit 1
          fi

      - name: Confirmar dashboard pessoal usando D1
        shell: bash
        run: |
          set -euo pipefail
          pronto=0
          for tentativa in $(seq 1 36); do
            codigo=$(curl --silent --show-error \
              --cookie cookies-m0043497.txt \
              --dump-header dashboard.headers \
              --output dashboard.json \
              --write-out '%{http_code}' \
              "${PAINEL_URL}/api/dashboard?periodo=mes-atual" || true)

            backend=$(awk 'BEGIN{IGNORECASE=1} /^x-db-backend:/ {gsub("\r", "", $2); print tolower($2)}' dashboard.headers | tail -n 1)
            if [ "$codigo" = "200" ] && [ "$backend" = "d1" ]; then
              pronto=1
              break
            fi
            echo "Aguardando dashboard pessoal no D1 (${tentativa}/36, HTTP ${codigo}, backend=${backend:-ausente})."
            sleep 10
          done

          if [ "$pronto" != "1" ]; then
            echo "Dashboard não confirmou o D1 como banco do painel pessoal."
            cat dashboard.json || true
            exit 1
          fi

          python - <<'PY'
          import json
          with open('dashboard.json', encoding='utf-8') as arquivo:
              dados = json.load(arquivo)
          obrigatorios = ['ol_total_faturado', 'ol_sem_combate', 'clientes_ativos', 'filtros']
          ausentes = [campo for campo in obrigatorios if campo not in dados]
          if ausentes:
              raise SystemExit(f'Campos ausentes no dashboard: {ausentes}')
          print('Produção validada com acesso exclusivo do Maurício, D1 e dashboard ativos.')
          PY

      - name: Publicar resultado da produção
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADO_JOB: ${{ job.status }}
        shell: bash
        run: |
          estado=error
          descricao="Validação da produção falhou"
          if [ "$RESULTADO_JOB" = "success" ]; then
            estado=success
            descricao="Maurício, D1, dashboard e instalação validados"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$estado" \
            -f context="production/smoke" \
            -f description="$descricao"
