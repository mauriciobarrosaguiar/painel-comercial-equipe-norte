name: Validar painel em produção

on:
  workflow_run:
    workflows:
      - Deploy Painel no Cloudflare Pages
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: validar-painel-producao
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAINEL_URL: https://painel-equipe-norte.pages.dev
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Aguardar publicação do Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          pronto=0
          for tentativa in $(seq 1 30); do
            codigo=$(curl --silent --show-error --output session.json --write-out '%{http_code}' "${PAINEL_URL}/api/auth/session" || true)
            if [ "$codigo" = "401" ] && grep -q 'autenticado' session.json; then
              pronto=1
              break
            fi
            echo "Publicação ainda não disponível (${tentativa}/30, HTTP ${codigo})."
            sleep 10
          done
          if [ "$pronto" != "1" ]; then
            echo "A nova versão não ficou disponível no tempo esperado."
            exit 1
          fi

      - name: Validar página e instalação mobile
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "${PAINEL_URL}/" --output painel.html
          grep -q 'Painel Comercial' painel.html
          curl --fail --silent --show-error "${PAINEL_URL}/manifest.webmanifest" --output manifest.json
          grep -q 'Painel Comercial Equipe Norte' manifest.json

      - name: Validar os seis acessos autorizados
        shell: bash
        run: |
          set -euo pipefail
          logins=(a0002958 d0047303 j0050526 r0041868 m0043497 f0059410)
          nomes=(
            'ALESSANDRA FREITAS SA'
            'DENYSE CRISTINA VIANA VELOSO ARAUJO'
            'JOAO DIEGO FERREIRA DE OLIVEIRA'
            'RAIMUNDA MARTINS GOMES CARNEIRO'
            'MAURICIO BARROS DE AGUIAR'
            'FRANCISCO CORTEZ FILHO'
          )

          todos_ok=0
          for tentativa in $(seq 1 24); do
            todos_ok=1
            for indice in "${!logins[@]}"; do
              login="${logins[$indice]}"
              nome="${nomes[$indice]}"
              for acesso in "$login" "${login}@ems.com.br"; do
                arquivo="login-${login}-$(echo "$acesso" | tr '@.' '__').json"
                codigo=$(curl --silent --show-error --cookie-jar "cookies-${login}.txt" --output "$arquivo" --write-out '%{http_code}' \
                  --request POST "${PAINEL_URL}/api/auth/login" \
                  --header 'content-type: application/json' \
                  --data "{\"login\":\"${acesso}\"}" || true)
                if [ "$codigo" != "200" ] || ! jq -e --arg login "$login" --arg nome "$nome" '.usuario.login==$login and .usuario.nome==$nome' "$arquivo" >/dev/null 2>&1; then
                  todos_ok=0
                  break 2
                fi
              done
            done
            if [ "$todos_ok" = "1" ]; then
              break
            fi
            echo "Aguardando publicação dos acessos (${tentativa}/24)."
            sleep 10
          done

          if [ "$todos_ok" != "1" ]; then
            echo "Um ou mais acessos autorizados não funcionaram."
            exit 1
          fi

      - name: Confirmar dashboard, contingência e banco D1
        shell: bash
        run: |
          set -euo pipefail
          codigo=$(curl --silent --show-error --cookie cookies-m0043497.txt --output dashboard.json --write-out '%{http_code}' \
            "${PAINEL_URL}/api/dashboard?periodo=mes-atual")

          python - "$codigo" <<'PY'
          import json
          import sys

          codigo = int(sys.argv[1])
          with open('dashboard.json', encoding='utf-8') as arquivo:
              dados = json.load(arquivo)

          if codigo == 200:
              obrigatorios = ['ol_total_faturado', 'ol_sem_combate', 'clientes_ativos', 'filtros']
              ausentes = [campo for campo in obrigatorios if campo not in dados]
              if ausentes:
                  raise SystemExit(f'Campos ausentes no dashboard: {ausentes}')
              contingencia = dados.get('contingencia') or {}
              if contingencia and contingencia.get('modo') not in (None, 'individual'):
                  raise SystemExit(f'Modo de contingência inesperado: {contingencia}')
              print('Dashboard disponível e isolado conforme a contingência atual.')
          elif codigo == 403:
              codigo_esperado = dados.get('codigo')
              if codigo_esperado != 'CONTINGENCIA_AGUARDANDO_ACESSO':
                  raise SystemExit(f'Bloqueio inesperado no dashboard: {dados}')
              print('Painel de espera validado para consultor ainda não publicado.')
          else:
              raise SystemExit(f'Dashboard retornou HTTP {codigo}: {dados}')
          PY

      - name: Publicar resultado da produção
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADO_JOB: ${{ job.status }}
        shell: bash
        run: |
          estado=error
          descricao="Validação da produção falhou"
          if [ "$RESULTADO_JOB" = "success" ]; then
            estado=success
            descricao="Acessos, D1, dashboard e contingência validados"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$estado" \
            -f context="production/smoke" \
            -f description="$descricao"
