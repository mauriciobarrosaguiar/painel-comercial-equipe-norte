name: Extrair Bússola para D1

on:
  workflow_dispatch:
    inputs:
      command_id:
        description: "Identificador do disparo feito pelo painel"
        required: false
        default: ""
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: bussola-d1
  cancel-in-progress: false

jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências completas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar navegador
        run: |
          google-chrome --version || chromium --version || chromium-browser --version

      - name: Extrair Bússola e sincronizar D1
        env:
          PYTHONPATH: ${{ github.workspace }}
          PAINEL_BASE_URL: https://painel-equipe-norte.pages.dev
          PAINEL_ADMIN_KEY: ${{ secrets.PAINEL_ADMIN_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE: painel-equipe-norte-db
        run: python scripts/extrair_bussola_d1_corrigido.py

  finalizar_comando:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.command_id != '' }}
    needs: extrair
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar solicitação no painel
        env:
          PAINEL_URL: https://painel-equipe-norte.pages.dev
          PAINEL_ADMIN_KEY: ${{ secrets.PAINEL_ADMIN_KEY }}
          COMMAND_ID: ${{ inputs.command_id }}
          RESULTADO: ${{ needs.extrair.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RESULTADO" = "success" ]; then
            STATUS="concluido"
            MENSAGEM="Extração do Bússola concluída e sincronizada no painel."
            ERRO=""
          else
            STATUS="erro"
            MENSAGEM=""
            ERRO="A extração do Bússola terminou com status ${RESULTADO}. Consulte o GitHub Actions para os detalhes."
          fi
          jq -n \
            --arg id "$COMMAND_ID" \
            --arg status "$STATUS" \
            --arg mensagem "$MENSAGEM" \
            --arg erro "$ERRO" \
            '{acao:"finalizar",id:$id,status:$status,mensagem:$mensagem,erro:$erro}' > finalizar.json
          curl --fail-with-body --silent --show-error \
            --request POST "${PAINEL_URL}/api/internal/automacoes" \
            --header "x-admin-key: ${PAINEL_ADMIN_KEY}" \
            --header "content-type: application/json" \
            --data @finalizar.json
