name: Extrair Bússola para D1

on:
  workflow_dispatch:
    inputs:
      command_id:
        description: "Identificador do disparo feito pelo painel"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: bussola-d1
  cancel-in-progress: false

jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências completas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar navegador
        run: |
          google-chrome --version || chromium --version || chromium-browser --version

      - name: Extrair Bússola e sincronizar D1
        env:
          PYTHONPATH: ${{ github.workspace }}
          PAINEL_BASE_URL: https://painel-equipe-norte.pages.dev
          PAINEL_ADMIN_KEY: ${{ secrets.PAINEL_ADMIN_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE: painel-equipe-norte-db
        run: python scripts/extrair_bussola_d1_corrigido.py

      - name: Aplicar classificação MIX por código SAP
        env:
          PYTHONPATH: ${{ github.workspace }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE: painel-equipe-norte-db
        run: python scripts/aplicar_mix_sap_d1.py

      - name: Fechar mês anterior e reconciliar histórico
        env:
          PAINEL_URL: https://painel-equipe-norte.pages.dev
          PAINEL_ADMIN_KEY: ${{ secrets.PAINEL_ADMIN_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          export TZ=America/Araguaina

          fechar_mes() {
            local MES="$1"
            local APENAS_FECHADO="$2"
            local MOTIVO="$3"

            jq -n \
              --arg ano_mes "$MES" \
              --argjson apenas_fechado "$APENAS_FECHADO" \
              --arg motivo "$MOTIVO" \
              '{
                ano_mes:$ano_mes,
                automatico:true,
                reprocessar:true,
                somente_se_alterado:true,
                apenas_fechado:$apenas_fechado,
                motivo:$motivo
              }' > reconciliar-fechamento.json

            echo "Processando histórico de ${MES}..."
            curl --fail-with-body --silent --show-error \
              --request POST "${PAINEL_URL}/api/internal/fechamento-mensal" \
              --header "x-admin-key: ${PAINEL_ADMIN_KEY}" \
              --header "content-type: application/json" \
              --data @reconciliar-fechamento.json
            echo
          }

          ANO_MES=$(date -d "$(date +%Y-%m-01) -1 month" +%Y-%m)

          # Primeira extração do novo mês cria automaticamente o fechamento do mês anterior.
          fechar_mes \
            "$ANO_MES" \
            false \
            "Fechamento automático após a virada do mês: metas congeladas e resultado faturado registrado no histórico."

          # Em toda nova extração, meses já fechados também são recalculados.
          # A API só cria nova versão se o realizado mudou e mantém as metas originais congeladas.
          curl --fail-with-body --silent --show-error \
            "${PAINEL_URL}/api/historico" > historico-mensal.json

          jq -r '.meses[]? | select(.origem == "FECHAMENTO") | .ano_mes' historico-mensal.json \
            | sort -u \
            | while read -r MES_FECHADO; do
                [ -n "$MES_FECHADO" ] || continue
                [ "$MES_FECHADO" = "$ANO_MES" ] && continue
                [[ "$MES_FECHADO" > "$ANO_MES" ]] && continue
                fechar_mes \
                  "$MES_FECHADO" \
                  true \
                  "Atualização automática após extração da Bússola: faturamentos retroativos incorporados sem alterar a meta congelada do mês."
              done

  finalizar_comando:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.command_id != '' }}
    needs: extrair
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar solicitação no painel
        env:
          PAINEL_URL: https://painel-equipe-norte.pages.dev
          PAINEL_ADMIN_KEY: ${{ secrets.PAINEL_ADMIN_KEY }}
          COMMAND_ID: ${{ inputs.command_id }}
          RESULTADO: ${{ needs.extrair.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RESULTADO" = "success" ]; then
            STATUS="concluido"
            MENSAGEM="Extração do Bússola concluída pela credencial da GD, sincronizada, classificada pelo MIX, mês anterior fechado automaticamente e histórico reconciliado."
            ERRO=""
          else
            STATUS="erro"
            MENSAGEM=""
            ERRO="A extração do Bússola terminou com status ${RESULTADO}. Consulte o GitHub Actions para os detalhes."
          fi
          jq -n \
            --arg id "$COMMAND_ID" \
            --arg status "$STATUS" \
            --arg mensagem "$MENSAGEM" \
            --arg erro "$ERRO" \
            '{acao:"finalizar",id:$id,status:$status,mensagem:$mensagem,erro:$erro}' > finalizar.json
          curl --fail-with-body --silent --show-error \
            --request POST "${PAINEL_URL}/api/internal/automacoes" \
            --header "x-admin-key: ${PAINEL_ADMIN_KEY}" \
            --header "content-type: application/json" \
            --data @finalizar.json
