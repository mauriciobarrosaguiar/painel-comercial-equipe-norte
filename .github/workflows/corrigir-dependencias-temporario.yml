name: Corrigir dependencias npm (temporario)

on:
  push:
    branches:
      - modo-pessoal-mauricio
    paths:
      - ".github/workflows/corrigir-dependencias-temporario.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: modo-pessoal-mauricio
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Atualizar dependencias vulneraveis
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set devDependencies.wrangler="4.136.3"
          npm pkg set overrides.sharp="0.35.4"
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts

      - name: Instalar dependencias corrigidas
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Validar auditoria sem vulnerabilidade alta
        working-directory: web
        run: npm audit --audit-level=high

      - name: Testar aplicacao
        working-directory: web
        run: npm run test:web

      - name: Compilar aplicacao
        working-directory: web
        run: npm run build

      - name: Salvar correcao e remover workflow temporario
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/package-lock.json
          git rm .github/workflows/corrigir-dependencias-temporario.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para salvar."
            exit 0
          fi
          git commit -m "Atualiza dependencias npm vulneraveis"
          git push origin HEAD:modo-pessoal-mauricio
