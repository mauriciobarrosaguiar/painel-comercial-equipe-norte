name: Atualizar lock da contingência

on:
  push:
    branches:
      - ajuste/contingencia-bussola-consultores
    paths:
      - web/package.json
      - .github/workflows/atualizar-lock-contingencia.yml

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: ajuste/contingencia-bussola-consultores

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Regenerar package-lock
        working-directory: web
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=high

      - name: Salvar package-lock atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          if git diff --cached --quiet; then
            echo "Package-lock já estava atualizado."
            exit 0
          fi
          git commit -m "Atualiza package-lock com correções de segurança"
          git push origin HEAD:ajuste/contingencia-bussola-consultores
